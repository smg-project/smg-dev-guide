repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ['--skip=LICENSE,evals/results', '-L', 'wit,WIT,ser,crate,nd']

  - repo: local
    hooks:
      - id: lint-guide
        name: Guide self-lint (recipe refs, front matter, symlinks, manifests, hooks)
        entry: python3 scripts/lint_guide.py
        language: system
        pass_filenames: false
        always_run: true

      - id: dco-check
        name: DCO sign-off check
        entry: >-
          sh -c 'grep -q "^Signed-off-by:" "$1" ||
          { echo "Missing Signed-off-by trailer. Commit with: git commit -s"; exit 1; }' --
        language: system
        stages: [commit-msg]

      - id: branch-name-check
        name: Branch name convention
        entry: >-
          sh -c 'branch=$(git rev-parse --abbrev-ref HEAD); case "$branch" in
          main|setup/*|feat/*|fix/*|docs/*|chore/*|refactor/*) exit 0;;
          *) echo "Branch name must match: setup/*, feat/*, fix/*, docs/*, chore/*, refactor/*"; exit 1;;
          esac'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
